name: REGIS geometric screen overlap qualification

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'work/regis-point-columns'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Reacquire pinned raw hydro columns
        run: |
          python -m wdm_lhm.regis_hydro_probe_cli \
            --output-dir regis-screen-overlap-evidence
      - name: Recreate qualified parsed hydro columns
        run: |
          python -m wdm_lhm.regis_hydro_parse_cli \
            --raw-dir regis-screen-overlap-evidence \
            --output regis-screen-overlap-evidence/regis_hydro_columns.json
      - name: Validate parsed dependency hash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("regis-screen-overlap-evidence/regis_hydro_columns.json")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = "155db35ac5d7fde4c5ad28e50b7ed3f055b59124e9dcbf4949e110683be3e5c8"
          if digest != expected:
              raise SystemExit(f"Parsed hydro SHA drift: {digest} != {expected}")
          print(digest)
          PY
      - name: Compute geometry-only screen overlap
        run: |
          python -m wdm_lhm.regis_screen_overlap_cli \
            --parsed regis-screen-overlap-evidence/regis_hydro_columns.json \
            --output regis-screen-overlap-evidence/regis_screen_overlap.json
      - name: Validate geometry-only evidence and boundary sensitivity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("regis-screen-overlap-evidence/regis_screen_overlap.json")
          data = json.loads(p.read_text())
          expected = {
              ("4074_nominal", "tube1"): (["NUBXz3", "NUBXz4", "NUgsc"], ["0.69", "1.07", "1.24"]),
              ("4074_nominal", "tube2"): (["NUgsc"], ["0.50"]),
              ("4074_west_boundary_sensitivity", "tube1"): (["NUgsc"], ["3.00"]),
              ("4074_west_boundary_sensitivity", "tube2"): (["NUgsc"], ["0.50"]),
              ("4104_nominal", "tube1"): (["NUgsc"], ["2.00"]),
              ("4104_nominal", "tube2"): (["NUPZ-WAz1"], ["2.00"]),
          }
          for (column, tube), (layers, overlaps) in expected.items():
              screen = data["results"][column]["screens"][tube]
              if screen["layer_sequence"] != layers:
                  raise SystemExit(f"Layer-sequence drift for {column}/{tube}: {screen['layer_sequence']}")
              actual = [item["overlap_m"] for item in screen["overlaps"]]
              if actual != overlaps:
                  raise SystemExit(f"Overlap drift for {column}/{tube}: {actual}")
              if not screen["coverage_complete"] or screen["uncovered_m"] != "0.00":
                  raise SystemExit(f"Incomplete screen coverage for {column}/{tube}: {screen}")

          surface = {
              "4074_nominal": ("8.15", "7.93", "0.22"),
              "4074_west_boundary_sensitivity": ("7.77", "7.93", "-0.16"),
              "4104_nominal": ("11.15", "9.81", "1.34"),
          }
          for column, values in surface.items():
              d = data["results"][column]["surface_diagnostic"]
              if (d["regis_mv_m_nap"], d["bro_ground_m_nap"], d["regis_minus_bro_ground_m"]) != values:
                  raise SystemExit(f"Surface diagnostic drift for {column}: {d}")
              if d["used_for_screen_elevation"]:
                  raise SystemExit(f"REGIS mv improperly used to derive screen elevations for {column}")

          cmp = data["comparisons"]["4074_boundary_sensitivity"]["tubes"]
          if cmp["tube1"]["same_layer_sequence"] is not False:
              raise SystemExit("4074 tube1 boundary sensitivity unexpectedly disappeared")
          if cmp["tube2"]["same_layer_sequence"] is not True:
              raise SystemExit("4074 tube2 layer sequence unexpectedly differs")

          guards = data["guardrails"]
          required_true = (
              "geometry_only",
              "bro_ground_level_is_screen_elevation_authority",
              "regis_mv_used_as_diagnostic_only",
          )
          for key in required_true:
              if not guards[key]:
                  raise SystemExit(f"Required guardrail false: {key}")
          for key in (
              "hydraulic_property_interpretation_performed",
              "layer_code_semantics_applied",
              "columns_averaged",
              "admission_decision_performed",
          ):
              if guards[key]:
                  raise SystemExit(f"Boundary violation: {key}=true")
          print(json.dumps({"results": data["results"], "comparisons": data["comparisons"], "guardrails": guards}, indent=2))
          PY
      - name: Upload geometric overlap evidence
        uses: actions/upload-artifact@v4
        with:
          name: regis-screen-overlap-${{ github.run_id }}
          path: regis-screen-overlap-evidence
          if-no-files-found: error
          retention-days: 14
