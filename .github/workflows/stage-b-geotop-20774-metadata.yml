name: Stage-B GeoTOP 20774 metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/wdm_lhm/geotop_metadata.py'
      - 'src/wdm_lhm/geotop_metadata_cli.py'
      - 'tests/test_geotop_metadata.py'
      - '.github/workflows/stage-b-geotop-20774-metadata.yml'
      - 'docs/qualification/STAGE_B_GEOTOP_20774_CHECKPOINT.md'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Acquire GeoTOP DDS/DAS metadata only
        run: |
          python -m wdm_lhm.geotop_metadata_cli --output-dir stage_b_geotop_20774_metadata
      - name: Validate metadata-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stage_b_geotop_20774_metadata/geotop_metadata_manifest.json')
          m = json.loads(p.read_text())
          assert m['capability'] == 'STAGE_B_GEOTOP_20774_METADATA'
          assert m['state'] == 'METADATA_ACQUIRED_NOT_INTERPRETED'
          assert m['guardrails']['metadata_only'] is True
          assert m['guardrails']['data_requests_issued'] is False
          assert m['guardrails']['constraint_expression_issued'] is False
          assert m['guardrails']['voxel_values_read'] is False
          assert m['guardrails']['lithology_interpretation_performed'] is False
          assert m['guardrails']['hydraulic_interpretation_performed'] is False
          assert m['guardrails']['screen_correlation_performed'] is False
          assert m['guardrails']['admission_decision_performed'] is False
          assert m['guardrails']['allow_admissible_enabled'] is False
          for key in ('x', 'y', 'z'):
              assert key in m['dds_inventory']['dimensions']
              assert m['expected_variable_presence'][key] is True
          print({
              'dimensions': m['dds_inventory']['dimensions'],
              'expected_variable_presence': m['expected_variable_presence'],
              'dds_sha256': m['dataset']['dds']['sha256'],
              'das_sha256': m['dataset']['das']['sha256'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage-b-geotop-20774-metadata-${{ github.run_id }}
          path: stage_b_geotop_20774_metadata/
          retention-days: 14
          if-no-files-found: error
