name: Stage-B GeoTOP authority text extraction

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wdm_lhm/geotop_authority_document_acquisition.py'
      - 'src/wdm_lhm/geotop_authority_document_acquisition_cli.py'
      - 'src/wdm_lhm/geotop_authority_text_extraction.py'
      - 'src/wdm_lhm/geotop_authority_text_extraction_cli.py'
      - 'tests/test_geotop_authority_text_extraction.py'
      - 'docs/qualification/STAGE_B_GEOTOP_CODEBOOK_AUTHORITY.md'
      - '.github/workflows/stage-b-geotop-authority-text.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and PDF text extractor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Record text extractor identity
        run: |
          command -v pdftotext
          pdftotext -v
      - name: Reacquire fixed official PDFs and require Gate-3A hashes
        run: |
          python -m wdm_lhm.geotop_authority_document_acquisition_cli --output-dir stage_b_geotop_authority_documents
      - name: Extract page-preserving text only
        run: |
          python -m wdm_lhm.geotop_authority_text_extraction_cli \
            --source-dir stage_b_geotop_authority_documents \
            --output-dir stage_b_geotop_authority_text
          cp stage_b_geotop_authority_documents/geotop_authority_document_acquisition_manifest.json \
             stage_b_geotop_authority_text/source_acquisition_manifest.json
      - name: Validate extraction-only boundary and pinned source hashes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('stage_b_geotop_authority_text')
          m = json.loads((root / 'geotop_authority_text_extraction_manifest.json').read_text())
          expected = {
              'v16_supplement': 'd35108ce0749007935565778392dd4d4d32a40ad08d48f6c5c37d833b0746ad3',
              'v161_small_release': '9b50b3a2d1b02d3292ef4f5259a6716f1f0aa0ae11341ad5b0eb9c80a4a5ba83',
              'general_report': '9c72f77d4ec84272ec007e7c31e8f60877aec10d5abf1d77fd9b0cdb11bf3cba',
          }
          assert m['capability'] == 'STAGE_B_GEOTOP_161_CODEBOOK_AUTHORITY_TEXT_EXTRACTION'
          assert m['state'] == 'QUALIFIED_SOURCE_TEXT_EXTRACTED_NOT_SEMANTICALLY_ADJUDICATED'
          assert m['expected_source_sha256'] == expected
          assert set(m['documents']) == set(expected)
          for key, rec in m['documents'].items():
              assert rec['source_sha256'] == expected[key]
              assert rec['page_count'] > 0
              assert len(rec['page_index']) == rec['page_count']
              assert [p['page'] for p in rec['page_index']] == list(range(1, rec['page_count'] + 1))
              assert (root / rec['text_file']).exists()
              assert rec['text_sha256']
          g = m['guardrails']
          assert g['exact_gate_3a_hashes_required'] is True
          assert g['page_index_preserved'] is True
          assert g['text_extraction_only'] is True
          assert g['code_translation_performed'] is False
          assert g['version_compatibility_established'] is False
          assert g['geological_interpretation_performed'] is False
          assert g['hydraulic_interpretation_performed'] is False
          assert g['screen_correlation_performed'] is False
          assert g['admission_decision_performed'] is False
          assert g['allow_admissible_enabled'] is False
          print(json.dumps({
              key: {
                  'source_sha256': rec['source_sha256'],
                  'text_sha256': rec['text_sha256'],
                  'text_bytes': rec['text_bytes'],
                  'page_count': rec['page_count'],
                  'marker_hits': rec['marker_hits'],
                  'observed_code_occurrences': rec['observed_code_occurrences'],
              }
              for key, rec in m['documents'].items()
          }, indent=2, sort_keys=True))
          PY
      - name: Upload extracted text and page-index evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-geotop-authority-text-${{ github.run_id }}
          path: stage_b_geotop_authority_text/
          retention-days: 14
          if-no-files-found: error
