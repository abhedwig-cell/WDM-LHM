name: REGIS acquisition probe

on:
  pull_request:
    paths:
      - "src/wdm_lhm/regis_probe.py"
      - "src/wdm_lhm/regis_probe_cli.py"
      - "tests/test_regis_probe.py"
      - "docs/qualification/STAGE_B_REGIS_ACQUISITION.md"
      - ".github/workflows/regis-probe.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      atom_url:
        description: "REGIS II ATOM entry point"
        required: true
        default: "https://service.pdok.nl/tno/bro-regis-ii/atom/index.xml"
      max_depth:
        description: "Maximum nested ATOM depth"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  regis-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Resolve parameters
        id: params
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "atom_url=${{ inputs.atom_url }}" >> "$GITHUB_OUTPUT"
            echo "max_depth=${{ inputs.max_depth }}" >> "$GITHUB_OUTPUT"
          else
            echo "atom_url=https://service.pdok.nl/tno/bro-regis-ii/atom/index.xml" >> "$GITHUB_OUTPUT"
            echo "max_depth=3" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe public REGIS delivery
        run: |
          wdm-lhm-regis-probe output/regis_probe \
            --atom-url "${{ steps.params.outputs.atom_url }}" \
            --max-depth "${{ steps.params.outputs.max_depth }}"
      - name: Validate acquisition evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("output/regis_probe/regis_probe_manifest.json")
          if not p.exists():
              raise SystemExit("Missing REGIS probe manifest")
          m = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps(m, indent=2))
          if m["counts"]["feeds"] < 1:
              raise SystemExit("No REGIS ATOM feeds parsed")
          if m["counts"]["download_candidates"] < 1:
              raise SystemExit("No REGIS download candidates discovered")
          if any(d["href"].startswith("file:") for d in m["downloads"]):
              raise SystemExit("Unexpected non-public download URI")
          PY
      - name: Upload reproducible acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regis-probe-${{ github.run_id }}
          path: output/regis_probe/
          if-no-files-found: warn
          retention-days: 14
