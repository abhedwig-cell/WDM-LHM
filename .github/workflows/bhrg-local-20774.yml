name: Stage-B local BHR-G 20774 acquisition

on:
  pull_request:
    paths:
      - "src/wdm_lhm/bhrg_local_acquisition.py"
      - "src/wdm_lhm/bhrg_local_acquisition_cli.py"
      - "tests/test_bhrg_local_acquisition.py"
      - ".github/workflows/bhrg-local-20774.yml"
      - "docs/qualification/STAGE_B_LOCAL_BHRG_20774_CHECKPOINT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Acquire bounded local BHR-G raw evidence
        run: |
          python -m wdm_lhm.bhrg_local_acquisition_cli \
            --output-dir stage_b_local_bhrg_20774

      - name: Validate acquisition boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("stage_b_local_bhrg_20774/bhrg_local_manifest.json")
          m = json.loads(p.read_text())
          assert m["capability"] == "STAGE_B_LOCAL_BHRG_20774_ACQUISITION"
          assert m["target"]["gmw"] == "GMW000000020774"
          assert m["search"]["radius_km"] == 0.5
          assert m["result"]["count"] <= m["search"]["declared_result_limit"]
          assert m["guardrails"]["raw_only"] is True
          assert m["guardrails"]["lithology_interpretation_performed"] is False
          assert m["guardrails"]["hydraulic_interpretation_performed"] is False
          assert m["guardrails"]["screen_correlation_performed"] is False
          assert m["guardrails"]["geotop_used"] is False
          assert m["guardrails"]["admission_decision_performed"] is False
          assert m["guardrails"]["allow_admissible_enabled"] is False
          print({
              "state": m["result"]["state"],
              "count": m["result"]["count"],
              "bro_ids": m["result"]["bro_ids"],
          })
          PY

      - name: Upload bounded raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-local-bhrg-20774-${{ github.run_id }}
          path: stage_b_local_bhrg_20774/
          retention-days: 14
          if-no-files-found: error
