name: Stage-B GeoTOP dataset reference-page acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wdm_lhm/geotop_reference_page_acquisition.py'
      - 'src/wdm_lhm/geotop_reference_page_acquisition_cli.py'
      - 'tests/test_geotop_reference_page_acquisition.py'
      - 'docs/qualification/STAGE_B_GEOTOP_CODEBOOK_AUTHORITY.md'
      - '.github/workflows/stage-b-geotop-reference-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Acquire exact dataset-referenced DINOloket page only
        run: |
          python -m wdm_lhm.geotop_reference_page_acquisition_cli --output-dir stage_b_geotop_reference_page
      - name: Validate reference-page-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stage_b_geotop_reference_page/geotop_reference_page_manifest.json')
          m = json.loads(p.read_text())
          assert m['capability'] == 'STAGE_B_GEOTOP_161_REFERENCE_PAGE_ACQUISITION'
          assert m['state'] == 'DATASET_REFERENCED_OFFICIAL_PAGE_ACQUIRED_NOT_INTERPRETED'
          assert m['request']['dataset_references_url'] == 'http://www.dinoloket.nl/detaillering-van-de-bovenste-lagen-met-geotop'
          assert m['request']['final_url'].startswith('https://')
          g = m['guardrails']
          assert g['exact_dataset_reference_only'] is True
          assert g['official_redirect_only'] is True
          assert g['discovered_links_followed'] is False
          assert g['code_translation_performed'] is False
          assert g['version_compatibility_established'] is False
          assert g['geological_interpretation_performed'] is False
          assert g['hydraulic_interpretation_performed'] is False
          assert g['admission_decision_performed'] is False
          assert g['allow_admissible_enabled'] is False
          print(json.dumps({
              'final_url': m['request']['final_url'],
              'sha256': m['response']['sha256'],
              'marker_hits': m['marker_hits'],
              'official_links': m['official_links'],
          }, indent=2))
          PY
      - name: Upload raw reference-page evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-geotop-reference-page-${{ github.run_id }}
          path: stage_b_geotop_reference_page/
          retention-days: 14
          if-no-files-found: error
