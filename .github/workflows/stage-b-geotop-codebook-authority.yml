name: Stage-B GeoTOP codebook authority discovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wdm_lhm/geotop_codebook_authority_discovery.py'
      - 'src/wdm_lhm/geotop_codebook_authority_discovery_cli.py'
      - 'tests/test_geotop_codebook_authority_discovery.py'
      - 'docs/qualification/STAGE_B_GEOTOP_CODEBOOK_AUTHORITY.md'
      - '.github/workflows/stage-b-geotop-codebook-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Acquire exact official GeoTOP service resources only
        run: |
          python -m wdm_lhm.geotop_codebook_authority_discovery_cli --output-dir stage_b_geotop_codebook_authority
      - name: Validate discovery-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stage_b_geotop_codebook_authority/geotop_codebook_authority_discovery_manifest.json')
          m = json.loads(p.read_text())
          assert m['capability'] == 'STAGE_B_GEOTOP_161_CODEBOOK_AUTHORITY_DISCOVERY'
          assert m['state'] == 'OFFICIAL_DATASET_SERVICE_RESOURCES_ACQUIRED_NOT_INTERPRETED'
          assert set(m['resources']) == {'html', 'info'}
          g = m['guardrails']
          assert g['official_dataset_resources_only'] is True
          assert g['discovered_links_followed'] is False
          assert g['third_party_resources_requested'] is False
          assert g['code_translation_performed'] is False
          assert g['version_compatibility_established'] is False
          assert g['geological_interpretation_performed'] is False
          assert g['hydraulic_interpretation_performed'] is False
          assert g['admission_decision_performed'] is False
          assert g['allow_admissible_enabled'] is False
          print(json.dumps({
              'resource_sha256': {k: v['sha256'] for k, v in m['resources'].items()},
              'official_links': m['official_links'],
              'marker_hits': m['marker_hits'],
          }, indent=2))
          PY
      - name: Upload raw authority-discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-geotop-codebook-authority-${{ github.run_id }}
          path: stage_b_geotop_codebook_authority/
          retention-days: 14
          if-no-files-found: error
